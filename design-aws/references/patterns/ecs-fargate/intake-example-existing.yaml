# ============================================================
#  ECS Fargate — Intake EXAMPLE (BROWNFIELD: reuse existing shared resources)
#
#  dev/sit/uat (non-prod) REUSE a shared existing VPC + shared ALB + a shared
#  wildcard ACM cert (added to the listener via SNI). prod CREATES its own
#  VPC + ALB + cert.
#
#  Shows: networking type=existing (subnet ids, no gateways/routes), alb type=existing,
#  acm type=existing wildcard, placement (ECS tasks in the container tier), and a
#  prod tier that creates everything fresh.
#
#  For the plain all-create starting point see intake-example.yaml;
#  for office/GIN connectivity see intake-example-tgw.yaml.
#
#  All values are DUMMY. Fill intake-template.yaml for a real project.
# ============================================================
schemaVersion: 1
pattern: ecs-fargate

# ── 1. Project & Environments ───────────────────────────────
# dev/sit/uat share the non-prod tier (same VPC/ALB/cert); prod is its own tier.
project:
  name: demo
  env:
    - { name: dev,  tier: non-prod, account: "111100001111", region: ap-southeast-1, domain: demo-dev.nonprod.dga.local }
    - { name: sit,  tier: non-prod, account: "111100001111", region: ap-southeast-1, domain: demo-sit.nonprod.dga.local }
    - { name: uat,  tier: non-prod, account: "111100001111", region: ap-southeast-1, domain: demo-uat.nonprod.dga.local }
    - { name: prod, tier: prod,     account: "999900009999", region: ap-southeast-1, domain: demo.dga.go.th }

# ── 2. Networking ───────────────────────────────────────────
networking:
  tiers:
    non-prod:                       # existing shared VPC — ids only (gateways/routes already exist)
      vpcName: shared-nonprod-vpc
      type: existing
      vpcId: vpc-0nonprod00000001
      subnets:
        public:    { ids: [subnet-0np-pub1, subnet-0np-pub2] }
        private:   { ids: [subnet-0np-pri1, subnet-0np-pri2] }
        container: { ids: [subnet-0np-con1, subnet-0np-con2] }
        database:  { ids: [subnet-0np-db1,  subnet-0np-db2] }
    prod:                           # create a new VPC (primary 10.30 + secondary 100.64)
      vpcName: demo-prod-vpc
      vpcCidr: 10.30.0.0/16
      secondaryCidr: 100.64.0.0/16
      type: create
      gateways:
        igw:        { type: internet-gateway }
        nat-public: { type: nat, connectivity: public, strategy: one-per-az, subnet: public }
      subnets:
        public:    { cidrs: [10.30.0.0/24, 10.30.1.0/24], routes: [{ dest: 0.0.0.0/0, target: igw }] }
        private:   { cidrs: [10.30.10.0/24, 10.30.11.0/24] }
        container: { cidrs: [100.64.0.0/18, 100.64.64.0/18], routes: [{ dest: 0.0.0.0/0, target: nat-public }] }
        database:  { isolated: true, cidrs: [100.64.128.0/24, 100.64.129.0/24] }

# ── 3. Platform ─────────────────────────────────────────────
platform:
  placement: { services: container }   # ECS tasks run in the container subnet tier (100.64.x)
  tiers:
    non-prod:
      ecs:        { enabled: true, containerInsights: false }
      ecr:        { enabled: true, mutability: MUTABLE, shared: true }
      alb:        { enabled: true, type: existing, albArn: "arn:aws:elasticloadbalancing:ap-southeast-1:111100001111:loadbalancer/app/shared/abc123", listenerArn: "arn:aws:elasticloadbalancing:ap-southeast-1:111100001111:listener/app/shared/abc123/def456" }
      acm:        { type: existing, arn: "arn:aws:acm:ap-southeast-1:111100001111:certificate/np-wild", domain: "*.nonprod.dga.local" }
      cloudfront: { enabled: true }
      waf:        { enabled: false }
      dns:        { enabled: true, provider: route53 }
    prod:
      ecs:        { enabled: true, containerInsights: true }
      ecr:        { enabled: true, mutability: IMMUTABLE, shared: true }
      alb:        { enabled: true, type: create, scheme: internet-facing, sslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06 }
      acm:        { type: create-new, domain: "*.dga.go.th" }
      cloudfront: { enabled: true }
      waf:        { enabled: true, mode: count, rateLimit: 2000 }
      dns:        { enabled: true, provider: route53 }

# ── 4. Services (cpu/memory/desiredCount = prod baseline; non-prod derives) ──
services:
  - { name: api,      type: api,      port: 3000, runtime: node,    health: /health, path: /cp/dga/demo/api/*, cpu: 2048, memory: 4096, desiredCount: 2, obs: { dashboard: true, alarms: true } }
  - { name: frontend, type: frontend, port: 4200, runtime: angular, health: /health, path: /cp/dga/demo/*,     cpu: 1024, memory: 2048, desiredCount: 2, obs: { dashboard: true, alarms: true } }

# ── 5. Observability ────────────────────────────────────────
observability:
  logRetention:
    non-prod: 14
    prod: 90
