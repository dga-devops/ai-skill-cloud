# platform.template.yaml — ECS Fargate platform.
#
# The "exposure + compute" layer on top of a network (network.yaml): the
# services that run, the ALB that exposes them, and the ACM cert for HTTPS.
#
# Same pattern as network.yaml everywhere: define things ONCE (networks / albs /
# certificates), then reference them per env under `environments:`. Anything
# shared by several envs (a VPC, an ALB, a wildcard cert) is written only once.
#
# Legend:  [REQUIRED] must fill  |  [optional: X] default is X

pattern: ecs-fargate

basePath: {{BASE_PATH}}                     # [REQUIRED] e.g. /cp/dga/demo — services use this as {base}

placement:                                  # [optional] which network.yaml subnet tier each part uses
  services: {{container | private}}         # [optional: container] ECS tasks run here (falls back to private)

services:                                   # [REQUIRED] at least 1
  - name: {{NAME}}                          # [REQUIRED] kebab-case, unique
    type: {{api | frontend | worker}}       # [REQUIRED]
    port: {{PORT}}                          # [REQUIRED unless worker] api=3000, frontend=4200
    healthCheckPath: {{PATH}}               # [optional: /health] not used by worker
    path: {{ROUTE}}                         # [optional: by type] ALB routes this → service; worker has none
    # default sizing — used by EVERY env unless overridden under environments: below
    cpu: {{CPU}}                            # [REQUIRED] 256 | 512 | 1024 | 2048 | 4096
    memory: {{MEMORY}}                      # [REQUIRED] MB (valid combo with cpu)
    desiredCount: {{N}}                     # [optional: 1]

albs:                                       # [REQUIRED] one or more named ALBs (define a shared one ONCE)
  {{ALB_NAME}}:                             # [REQUIRED] kebab-case name, referenced under environments:
    mode: {{existing | create}}             # [REQUIRED]
    # when mode = existing — reuse an ALB that already exists
    albArn: {{ALB_ARN}}                     # [REQUIRED if existing]
    listenerArn: {{LISTENER_ARN}}           # [REQUIRED if existing]
    # when mode = create — build a new ALB
    scheme: {{internet-facing | internal}}  # [optional: internet-facing]
    healthCheck:                            # [optional]
      interval: 30                          # [optional: 30]
      healthyThreshold: 3                   # [optional: 3]
      unhealthyThreshold: 3                 # [optional: 3]

certificates:                               # [REQUIRED] named ACM certs — a wildcard shared by many envs is defined ONCE
  {{CERT_NAME}}:                            # [REQUIRED] kebab-case name, referenced under environments:
    mode: {{create-new | existing}}         # [REQUIRED]
    domain: {{DOMAIN}}                      # [REQUIRED if create-new] e.g. "*.nonprod.example" (wildcard)
    arn: {{ACM_ARN}}                        # [REQUIRED if existing]

# Each env references an ALB + a cert (shared ones written once above) and gives
# its own hostname. The hostname must be covered by the referenced cert.
environments:                               # [REQUIRED] per env: alb + certificate + domain + sizing overrides
  {{ENV_NAME}}:
    alb: {{ALB_NAME}}                       # [REQUIRED] reference albs:
    certificate: {{CERT_NAME}}              # [REQUIRED] reference certificates: (a wildcard can serve many envs)
    domain: {{HOSTNAME}}                    # [REQUIRED] this env's hostname (must match the cert, e.g. orders-dev.nonprod.example)
    services:                               # [optional] override ONLY what differs from the defaults above
      {{SERVICE_NAME}}: { cpu: {{CPU}}, memory: {{MEMORY}}, desiredCount: {{N}} }

# Service types:
#   api       → ALB target, path like {base}/api/*   (no CDN cache)
#   frontend  → ALB target, path like {base}/*       (CDN cached)
#   worker    → no ALB target, no path (background processing)
#
# NEXT sections: Route53 record (domain → ALB), cloudfront (CDN + WAF).
