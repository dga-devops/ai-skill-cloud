# Project: demo — ECS Fargate platform (services + ALB + ACM + per-env sizing).
# Sits on top of the network defined in network.yaml.

pattern: ecs-fargate

basePath: /cp/dga/demo

placement:
  services: container            # ECS tasks run in the network's "container" tier (100.64.x)

services:
  - name: api
    type: api
    port: 3000
    healthCheckPath: /health
    path: "{base}/api/*"
    cpu: 512                     # default sizing (dev / sit / uat)
    memory: 1024
    desiredCount: 1
  - name: frontend
    type: frontend
    port: 4200
    healthCheckPath: /
    path: "{base}/*"
    cpu: 512
    memory: 1024
    desiredCount: 1

albs:
  nonprod-shared:                # existing ALB shared by dev / sit / uat — defined ONCE
    mode: existing
    albArn:      arn:aws:elasticloadbalancing:ap-southeast-1:111100001111:loadbalancer/app/shared/abc123
    listenerArn: arn:aws:elasticloadbalancing:ap-southeast-1:111100001111:listener/app/shared/abc123/def456
  prod:                          # new ALB created for prod
    mode: create
    scheme: internet-facing
    healthCheck: { interval: 30, healthyThreshold: 3, unhealthyThreshold: 3 }

certificates:
  nonprod-wildcard:              # ONE wildcard cert shared by dev / sit / uat
    mode: create-new
    domain: "*.nonprod.dga.local"
  prod:                          # prod wildcard
    mode: create-new
    domain: "*.dga.go.th"

# Each env: which ALB + which cert (shared) + its own hostname.
environments:
  dev:
    alb: nonprod-shared
    certificate: nonprod-wildcard
    domain: orders-dev.nonprod.dga.local
  sit:
    alb: nonprod-shared
    certificate: nonprod-wildcard
    domain: orders-sit.nonprod.dga.local
  uat:
    alb: nonprod-shared
    certificate: nonprod-wildcard
    domain: orders-uat.nonprod.dga.local
  prod:
    alb: prod
    certificate: prod
    domain: orders.dga.go.th
    services:                    # prod is bigger
      api:      { cpu: 2048, memory: 4096, desiredCount: 3 }
      frontend: { cpu: 1024, memory: 2048, desiredCount: 2 }
