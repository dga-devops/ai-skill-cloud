# awslabs/diagram-as-code Template for Miniapps
# Replace {{PLACEHOLDER}} values with actual design spec values
# Remove sections marked with {{#CONDITION}} ... {{/CONDITION}} if not enabled
#
# Render: awsdac diagram.yaml -o architecture.png

Diagram:
  DefinitionFiles:
    - Type: URL
      Url: "https://raw.githubusercontent.com/awslabs/diagram-as-code/main/definitions/definition-for-aws-icons-light.yaml"

  Resources:
    Canvas:
      Type: AWS::Diagram::Canvas
      Direction: vertical
      Children:
        - AWSCloud
        - User

    User:
      Type: AWS::Diagram::Resource
      Preset: User

    AWSCloud:
      Type: AWS::Diagram::Cloud
      Direction: vertical
      Preset: AWSCloudNoLogo
      Align: center
      Children:
        - CloudFront
        # {{#WAF_ENABLED}}
        - WAF
        # {{/WAF_ENABLED}}
        - VPC

    # --- CDN Layer ---
    CloudFront:
      Type: AWS::CloudFront::Distribution

    # {{#WAF_ENABLED}}
    WAF:
      Type: AWS::WAFv2::WebACL
    # {{/WAF_ENABLED}}

    # --- VPC ---
    VPC:
      Type: AWS::EC2::VPC
      Direction: vertical
      Children:
        - PublicSubnetStack
        - PrivateSubnetStack
        # {{#DATABASE_ENABLED}}
        - DataSubnetStack
        # {{/DATABASE_ENABLED}}
      BorderChildren:
        - Position: S
          Resource: IGW

    IGW:
      Type: AWS::EC2::InternetGateway

    # --- Public Subnets (ALB) ---
    PublicSubnetStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - PublicSubnet1
        - PublicSubnet2

    PublicSubnet1:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet
      Children:
        - ALB

    PublicSubnet2:
      Type: AWS::EC2::Subnet
      Preset: PublicSubnet

    ALB:
      Type: AWS::ElasticLoadBalancingV2::LoadBalancer
      Preset: Application Load Balancer

    # --- Private Subnets (ECS + Cache + Queue) ---
    PrivateSubnetStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - PrivateSubnet1
        - PrivateSubnet2

    PrivateSubnet1:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Children:
        - ECSService1
        # {{#CACHE_ENABLED}}
        - Redis
        # {{/CACHE_ENABLED}}

    PrivateSubnet2:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Children:
        - ECSService2
        # {{#QUEUE_ENABLED}}
        - SQSQueue
        # {{/QUEUE_ENABLED}}

    # --- ECS ---
    ECSService1:
      Type: AWS::ECS::Service

    ECSService2:
      Type: AWS::ECS::Service

    # {{#CACHE_ENABLED}}
    Redis:
      Type: AWS::ElastiCache::CacheCluster
    # {{/CACHE_ENABLED}}

    # {{#QUEUE_ENABLED}}
    SQSQueue:
      Type: AWS::SQS::Queue
    # {{/QUEUE_ENABLED}}

    # {{#DATABASE_ENABLED}}
    # --- Data Subnets (Database) ---
    DataSubnetStack:
      Type: AWS::Diagram::HorizontalStack
      Children:
        - DataSubnet1
        - DataSubnet2

    DataSubnet1:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Children:
        - AuroraWriter

    DataSubnet2:
      Type: AWS::EC2::Subnet
      Preset: PrivateSubnet
      Children:
        # {{#MULTI_AZ}}
        - AuroraReader
        # {{/MULTI_AZ}}

    AuroraWriter:
      Type: AWS::RDS::DBCluster

    # {{#MULTI_AZ}}
    AuroraReader:
      Type: AWS::RDS::DBInstance
    # {{/MULTI_AZ}}
    # {{/DATABASE_ENABLED}}

    # {{#STORAGE_ENABLED}}
    S3Bucket:
      Type: AWS::S3::Bucket
    # {{/STORAGE_ENABLED}}

  # --- Connections ---
  Links:
    - Source: User
      SourcePosition: N
      Target: CloudFront
      TargetPosition: S
      TargetArrowHead:
        Type: Open

    # {{#WAF_ENABLED}}
    - Source: CloudFront
      SourcePosition: N
      Target: WAF
      TargetPosition: S
      TargetArrowHead:
        Type: Open
    - Source: WAF
      SourcePosition: N
      Target: ALB
      TargetPosition: S
      TargetArrowHead:
        Type: Open
    # {{/WAF_ENABLED}}

    # {{^WAF_ENABLED}} (WAF disabled — direct connection)
    - Source: CloudFront
      SourcePosition: N
      Target: ALB
      TargetPosition: S
      TargetArrowHead:
        Type: Open
    # {{/WAF_ENABLED}}

    - Source: ALB
      SourcePosition: NNW
      Target: ECSService1
      TargetPosition: SSE
      TargetArrowHead:
        Type: Open

    - Source: ALB
      SourcePosition: NNE
      Target: ECSService2
      TargetPosition: SSW
      TargetArrowHead:
        Type: Open

    # {{#DATABASE_ENABLED}}
    - Source: ECSService1
      SourcePosition: N
      Target: AuroraWriter
      TargetPosition: S
      TargetArrowHead:
        Type: Open
    # {{/DATABASE_ENABLED}}

    # {{#CACHE_ENABLED}}
    - Source: ECSService1
      SourcePosition: E
      Target: Redis
      TargetPosition: W
      TargetArrowHead:
        Type: Open
    # {{/CACHE_ENABLED}}

    # {{#QUEUE_ENABLED}}
    - Source: ECSService2
      SourcePosition: E
      Target: SQSQueue
      TargetPosition: W
      TargetArrowHead:
        Type: Open
    # {{/QUEUE_ENABLED}}

    - Source: IGW
      SourcePosition: N
      Target: ALB
      TargetPosition: S
      TargetArrowHead:
        Type: Open
